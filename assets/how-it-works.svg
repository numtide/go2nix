<?xml version="1.0" encoding="UTF-8"?>
<!--
  How a go2nix build is laid out: one derivation per box, grouped by kind,
  edges are "is an input of". The highlighted path is what an edit to
  internal/web rebuilds; everything else is reused. Self-contained (system
  fonts), light by default, dark under prefers-color-scheme: dark. Plain SVG,
  meant to be edited by hand: every node is one <g class="node"> with a rect
  and a text, every edge one <path class="edge">.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="t d">
  <title id="t">The derivations of one go2nix build</title>
  <desc id="d">Module fetches (gomod) feed third-party package compiles (gopkg), which feed the compiles of your own packages (golocal), which feed the application derivation that links and runs the tests. The standard library is one derivation read by every compile, and an importcfg bundle collects the third-party entries for the link. Editing internal/web rebuilds internal/web, cmd/app and the application; the fetches, the third-party packages, the bundle and internal/db are reused.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #e6ddd3; }
    text { font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .kind { fill: #000000; font: 600 17px ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .what { fill: #6b625a; font-size: 14px; }
    .legend { fill: #303030; font-size: 15px; }
    .node rect { fill: #ffffff; stroke: #b9aa9b; stroke-width: 1.5; }
    .node text { fill: #4a433c; font: 16px ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .std rect { fill: #faf6f1; stroke: #b9aa9b; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .std text { fill: #4a433c; font-size: 14.5px; }
    .tick { stroke: #b9aa9b; stroke-width: 1.5; stroke-dasharray: 3 3; fill: none; }
    .group { stroke: #b9aa9b; stroke-width: 1.2; stroke-dasharray: 4 4; fill: none; }
    .edge { stroke: #b9aa9b; stroke-width: 1.5; fill: none; }
    .node.hot rect { stroke: url(#warm); stroke-width: 2.5; }
    .node.hot text { fill: #000000; }
    .edge.hot { stroke: url(#warm-abs); stroke-width: 2.5; }
    .pill rect { fill: #ff1063; }
    .pill text { fill: #ffffff; font-size: 13px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b0b0c; stroke: #2a2622; }
      .kind { fill: #ffffff; }
      .what { fill: #a59a90; }
      .legend { fill: #d0d0d0; }
      .node rect { fill: #0b0b0c; stroke: #5d544c; }
      .node text { fill: #c9beb3; }
      .std rect { fill: #15120f; stroke: #5d544c; }
      .std text { fill: #c9beb3; }
      .tick { stroke: #5d544c; }
      .group { stroke: #5d544c; }
      .edge { stroke: #5d544c; }
      .node.hot text { fill: #ffffff; }
    }
  </style>
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7bca"/>
      <stop offset="0.5" stop-color="#ff1063"/>
      <stop offset="1" stop-color="#f79224"/>
    </linearGradient>
    <linearGradient id="warm-abs" gradientUnits="userSpaceOnUse" x1="740" y1="0" x2="1000" y2="0">
      <stop offset="0" stop-color="#ff7bca"/>
      <stop offset="0.5" stop-color="#ff1063"/>
      <stop offset="1" stop-color="#f79224"/>
    </linearGradient>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="1199" height="539" rx="14"/>
  <g class="std"><rect x="280" y="46" width="660" height="34" rx="8"/><text x="610" y="68" text-anchor="middle">go-stdlib · built once, an input of every compile</text></g>
  <path class="tick" d="M375 80 V98"/>
  <path class="tick" d="M645 80 V98"/>
  <path class="tick" d="M870 80 V98"/>
  <text class="kind" x="125" y="118" text-anchor="middle">gomod-…</text><text class="what" x="125" y="138" text-anchor="middle">one fetch per module</text>
  <text class="kind" x="375" y="118" text-anchor="middle">gopkg-…</text><text class="what" x="375" y="138" text-anchor="middle">one compile per third-party package</text>
  <text class="kind" x="745" y="118" text-anchor="middle">golocal-…</text><text class="what" x="745" y="138" text-anchor="middle">one compile per package of yours</text>
  <text class="kind" x="1080" y="118" text-anchor="middle">the application</text><text class="what" x="1080" y="138" text-anchor="middle">link, then the tests</text>
  <path class="edge" d="M210 180 C245 180 245 180 280 180"/>
  <path class="edge" d="M210 245 C245 245 245 245 280 245"/>
  <path class="edge" d="M210 310 C245 310 245 310 280 310"/>
  <path class="edge" d="M470 180 C510 180 510 205 550 205"/>
  <path class="edge" d="M470 245 C510 245 510 205 550 205"/>
  <path class="edge" d="M470 245 C510 245 510 285 550 285"/>
  <path class="edge" d="M470 310 C510 310 510 285 550 285"/>
  <path class="edge" d="M740 205 C770 205 770 245 800 245"/>
  <path class="edge hot" d="M740 285 C770 285 770 245 800 245"/>
  <path class="edge hot" d="M940 245 C970 245 970 245 1000 245"/>
  <rect class="group" x="270" y="150" width="210" height="190" rx="12"/>
  <path class="edge" d="M375 340 V395"/>
  <path class="edge" d="M470 415 C960 415 1080 385 1080 265"/>
  <g class="node"><rect x="40" y="160" width="170" height="40" rx="8"/><text x="125" y="185.5" text-anchor="middle">x/sys</text></g>
  <g class="node"><rect x="40" y="225" width="170" height="40" rx="8"/><text x="125" y="250.5" text-anchor="middle">yaml</text></g>
  <g class="node"><rect x="40" y="290" width="170" height="40" rx="8"/><text x="125" y="315.5" text-anchor="middle">cobra</text></g>
  <g class="node"><rect x="280" y="160" width="190" height="40" rx="8"/><text x="375" y="185.5" text-anchor="middle">x/sys/unix</text></g>
  <g class="node"><rect x="280" y="225" width="190" height="40" rx="8"/><text x="375" y="250.5" text-anchor="middle">yaml</text></g>
  <g class="node"><rect x="280" y="290" width="190" height="40" rx="8"/><text x="375" y="315.5" text-anchor="middle">cobra</text></g>
  <g class="node"><rect x="550" y="185" width="190" height="40" rx="8"/><text x="645" y="210.5" text-anchor="middle">internal/db</text></g>
  <g class="node hot"><rect x="550" y="265" width="190" height="40" rx="8"/><text x="645" y="290.5" text-anchor="middle">internal/web</text></g>
  <g class="node hot"><rect x="800" y="225" width="140" height="40" rx="8"/><text x="870" y="250.5" text-anchor="middle">cmd/app</text></g>
  <g class="node hot"><rect x="1000" y="225" width="160" height="40" rx="8"/><text x="1080" y="250.5" text-anchor="middle">app</text></g>
  <g class="node"><rect x="280" y="395" width="190" height="40" rx="8"/><text x="375" y="420.5" text-anchor="middle">app-deps-importcfg</text></g>
  <text class="what" x="484" y="387">their importcfg entries + the stdlib's, for the link</text>
  <g class="pill"><rect x="607" y="315" width="76" height="24" rx="12"/><text x="645" y="332" text-anchor="middle">edited</text></g>
  <g class="node hot"><rect x="40" y="478" width="28" height="20" rx="5"/></g>
  <text class="legend" x="78" y="493">rebuilt after editing internal/web</text>
  <g class="node"><rect x="360" y="478" width="28" height="20" rx="5"/></g>
  <text class="legend" x="398" y="493">unchanged: taken from the Nix store or a binary cache</text>
</svg>
