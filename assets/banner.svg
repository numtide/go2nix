<?xml version="1.0" encoding="UTF-8"?>
<!--
  go2nix banner. 1280x640, self-contained (no external fonts or images), in
  the layout of numtide's repository banners: wordmark top left, mark top
  right, the faint 256px grid with its diamonds, title, subtitle, footer.
  Light by default, dark under prefers-color-scheme: dark.

  The Numtide wordmark and "N" mark are Numtide's; their outlines are copied
  unchanged from the banners numtide publishes for its repositories.

  The graph is go2nix's build model: one derivation per Go package. Editing
  internal/web rebuilds it and what depends on it; the rest is reused.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">go2nix</title>
  <desc id="desc">go2nix: a Nix builder for Go that compiles every package in its own derivation, so a change rebuilds only the packages that depend on it.</desc>
  <style>
    .bg { fill: #ffffff; }
    .ink { fill: #000000; }
    .sub { fill: #303030; }
    .grid { fill: #dfd1c3; }
    .line { stroke: #dfd1c3; fill: none; }
    text { font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .node rect { fill: #ffffff; stroke: #b9aa9b; stroke-width: 1.5; }
    .node text { fill: #6b625a; font: 17px ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .edge { stroke: #b9aa9b; stroke-width: 1.5; fill: none; }
    .node.hot rect { stroke: url(#warm); stroke-width: 2.5; }
    .node.hot text { fill: #000000; }
    .edge.hot { stroke: url(#warm); stroke-width: 2.5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #000000; }
      .ink { fill: #ffffff; }
      .sub { fill: #d0d0d0; }
      .grid { fill: #6f665e; }
      .line { stroke: #4a433c; }
      .node rect { fill: #000000; stroke: #5d544c; }
      .node text { fill: #a59a90; }
      .edge { stroke: #5d544c; }
      .node.hot text { fill: #ffffff; }
    }
  </style>
